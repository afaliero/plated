packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency build scripts unless listed here. Both of these link
# a platform-native binary at install time and are broken without it:
#   esbuild        -> the bundler behind tsx (apps/api dev/start)
#   unrs-resolver  -> native resolver used by eslint-import-resolver-typescript
allowBuilds:
  esbuild: true
  unrs-resolver: true
